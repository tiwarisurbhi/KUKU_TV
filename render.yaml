services:
  - type: web
    name: screening-room
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python frontend/build.py
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: VOICE_DEFAULT
        sync: false
