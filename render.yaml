services:
  - type: web
    name: screening-room
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python frontend/build.py
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      # Keys are tried in order 1 → 5. A key that runs out of credit (or is invalid) is retired
      # and the next one takes over. Leave unused slots empty.
      - key: SILICONFLOW_API_KEY_1
        sync: false
      - key: SILICONFLOW_API_KEY_2
        sync: false
      - key: SILICONFLOW_API_KEY_3
        sync: false
      - key: SILICONFLOW_API_KEY_4
        sync: false
      - key: SILICONFLOW_API_KEY_5
        sync: false
      - key: CARTESIA_API_KEY_1
        sync: false
      - key: CARTESIA_API_KEY_2
        sync: false
      - key: CARTESIA_API_KEY_3
        sync: false
      - key: CARTESIA_API_KEY_4
        sync: false
      - key: CARTESIA_API_KEY_5
        sync: false
      - key: VOICE_DEFAULT
        sync: false
